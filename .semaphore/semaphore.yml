version: v1.0
name: "\U0001F3AF Simple CI Pipeline"
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404
fail_fast:
  stop:
    when: branch != 'main'
auto_cancel:
  running:
    when: branch != 'main'
  queued:
    when: branch = 'main'
global_job_config:
  prologue:
    commands:
      - checkout
      - sem-version python 3.12
blocks:
  - name: 1-sigining
    dependencies: []
    task:
      jobs:
        - name: "\U0001F7E2 Run Tests"
          commands:
            - cd 1-signing
            - 'gpg --import /home/semaphore/public.key '
            - gpg --import /home/semaphore/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - gpg --verify artifact.txt.sig artifact.txt
      secrets:
        - name: GPG-RT
  - name: 2-sbom
    dependencies:
      - 1-sigining
    task:
      jobs:
        - name: "\U0001F4E6 Deploy to Production"
          commands:
            - cd 2-sbom
            - '#python -m venv venv'
            - '#source venv/bin/activate'
            - pip install cyclonedx-bom
            - cyclonedx-py requirements -o bom.json
            - artifact push job bom.json
